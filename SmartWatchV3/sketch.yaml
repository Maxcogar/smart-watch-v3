# Pinned arduino-cli build profile for the Waveshare ESP32-S3-Touch-LCD-2.
#
# The board options below are NOT optional. In particular PSRAM=opi and
# FlashSize=16M MUST be set: the LVGL framebuffers are allocated in OPI PSRAM,
# and the default ESP32-S3 board options have PSRAM DISABLED + 4MB flash, which
# produces a blank screen / boot crash. Build with:
#
#     arduino-cli compile -p esp32s3
#     arduino-cli upload  -p esp32s3 --port /dev/ttyACM0
#
profiles:
  esp32s3:
    notes: Waveshare ESP32-S3-Touch-LCD-2 (OPI PSRAM, 16MB flash, huge_app)
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,FlashMode=qio,PartitionScheme=huge_app,CDCOnBoot=cdc,USBMode=hwcdc,CPUFreq=240,UploadSpeed=921600
    platforms:
      # Core pinned to the 3.1.x line that Waveshare's Dec-2024/Jan-2025 demo
      # validates against. GFX 1.5.0 uses the pre-3.2.0 spiFrequencyToClockDiv()
      # signature and does NOT compile on core >=3.2.0 (incl. 3.3.x).
      - platform: esp32:esp32 (3.1.3)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      # Versions pinned to what Waveshare ships in their ESP32-S3-Touch-LCD-2
      # demo package (Arduino/libraries/*/library.properties). Do NOT bump
      # blindly: GFX >=1.6 removes the BLACK/RED/... color aliases the OEM
      # code uses, and the OEM validates against these exact versions.
      - GFX Library for Arduino (1.5.0)
      - lvgl (8.4.0)
      - ArduinoJson (7.4.3)

default_profile: esp32s3
